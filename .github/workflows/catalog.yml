name: BC Hub Catalog

on:
  push:
    branches:
      - main
      - feat/bc-hub-mvp
    paths:
      - 'tools/**/manifest.json'
      - 'scripts/build-catalog.mjs'
      - '.github/workflows/catalog.yml'
  pull_request:
    paths:
      - 'tools/**/manifest.json'
      - 'scripts/build-catalog.mjs'
      - '.github/workflows/catalog.yml'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build catalog
        run: node scripts/build-catalog.mjs

      - name: Validate catalog
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('data/tools.json','utf8')); if(!Array.isArray(x)) process.exit(1); console.log('Catálogo válido:', x.length, 'ferramenta(s)');"

      - name: Commit generated catalog
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- data/tools.json; then
            echo 'Catálogo já está atualizado.'
            exit 0
          fi
          git config user.name 'bc-hub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/tools.json
          git commit -m 'chore: regenerate tool catalog'
          git push